<svg
  [attr.viewBox]="'0 0 ' + width + ' ' + height"
  preserveAspectRatio="none"
  role="img"
  [attr.aria-label]="label()"
  style="width: 100%; height: 72px; display: block"
>
  <line [attr.x1]="0" [attr.x2]="width" [attr.y1]="height - pad" [attr.y2]="height - pad" stroke="var(--line)" stroke-width="1" />
  <polyline [attr.points]="points()" fill="none" stroke="var(--ink-2)" stroke-width="2" vector-effect="non-scaling-stroke" />
  <circle [attr.cx]="last().x" [attr.cy]="last().y" r="4" fill="var(--brand)" />
</svg>
