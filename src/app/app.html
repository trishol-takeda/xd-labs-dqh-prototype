<a class="skip-link" href="#main">Skip to content</a>

<header class="topbar on-dark">
  <div class="topbar-inner">
    <a class="brand" routerLink="/" aria-label="DQ Remediation, home">
      <span class="logo"><app-icon name="spark" [size]="18" /></span>
      <span>
        <strong>Data Quality Remediation Hub</strong>
        <small>Review, understand and fix data quality issues</small>
      </span>
    </a>
    @if (userName()) {
      <div class="user" [attr.title]="userName()">
        <span class="avatar" aria-hidden="true">{{ initials() }}</span>
        <span class="user-name">{{ userName() }}</span>
      </div>
    }
  </div>
  <p class="banner">
    <app-icon name="beaker" [size]="14" />
    Prototype · mock DQH data · rule runs are simulated, no service is connected
  </p>
</header>

<nav class="tabs" aria-label="Primary">
  <ul class="plain tabs-inner">
    @for (tab of tabs(); track tab.route) {
      <li>
        <a [routerLink]="tab.route" routerLinkActive="active" ariaCurrentWhenActive="page">
          <app-icon [name]="tab.icon" [size]="16" />{{ tab.label }}
        </a>
      </li>
    }
  </ul>
</nav>

<main id="main" tabindex="-1">
  <router-outlet />
</main>
