<section class="card stack" aria-labelledby="audit-title">
  <div class="row between">
    <h3 id="audit-title">History</h3>
    <span class="small muted">Audit trail: it cannot be edited or deleted</span>
  </div>
  <ol class="plain log">
    @for (e of entries(); track $index) {
      <li>
        <span class="small muted">{{ formatDate(e.at, true) }} · {{ e.by }}</span>
        <span class="wrap">{{ e.text }}</span>
        @if (e.why) {
          <span class="small muted wrap">Why: {{ e.why }}</span>
        }
      </li>
    }
  </ol>
</section>
