<section class="controls" aria-label="Prototype controls">
  <div class="controls-inner">
    <strong class="title"><app-icon name="sliders" [size]="14" />Prototype controls</strong>

    <div class="ctl" role="group" aria-label="Screen state to demonstrate">
      <span>Screen state</span>
      <span class="row" style="gap: 4px">
        @for (d of demos; track d.key) {
          <button type="button" class="chip" [attr.aria-pressed]="config.demo() === d.key" (click)="config.demo.set(d.key)">{{ d.label }}</button>
        }
      </span>
    </div>

    <div class="ctl legend" aria-label="Data origin legend">
      <app-origin-tag kind="repository" />
      <app-origin-tag kind="synthetic" />
      <app-origin-tag kind="provisional" />
    </div>

    <button type="button" class="btn small" (click)="resetDemo()"><app-icon name="refresh" [size]="14" />Reset demo data</button>
  </div>
</section>

<div class="page">
  @switch (store.status()) {
    @case ('loading') {
      <app-state-panel kind="loading" />
    }
    @case ('error') {
      <app-state-panel kind="error" title="My Domain could not load" message="The rule repository or domain catalogue did not load. Nothing has been changed.">
        <button type="button" class="btn primary" (click)="retry()"><app-icon name="refresh" [size]="14" />Try again</button>
      </app-state-panel>
    }
    @default {
      <router-outlet />
    }
  }
</div>
