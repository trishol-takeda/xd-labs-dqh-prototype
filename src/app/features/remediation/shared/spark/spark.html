<svg
  [class]="variant() === 'mini' ? 'rh-spark rh-sm' : 'rh-spark'"
  [attr.viewBox]="'0 0 ' + size().width + ' ' + size().height"
  preserveAspectRatio="none"
  aria-hidden="true"
>
  <path [attr.d]="path()" fill="none" stroke="var(--muted)" stroke-width="1.5" />
  @if (variant() === 'full') {
    <circle [attr.cx]="last()[0]" [attr.cy]="last()[1]" r="3" fill="var(--danger-fg)" />
  }
</svg>
