<ul class="rh-checks">
  @for (item of items(); track item.id) {
    <li>
      <button class="rh-hd" type="button" [attr.aria-expanded]="isOpen(item.id)" (click)="toggle(item.id)">
        <span>
          <b>{{ item.name }}</b><span class="rh-f">{{ item.requirement }}</span>
          @if (item.criticalField) {
            <app-chip kind="badge">Critical field</app-chip>
          }
        </span>
        @if (item.failingNow > 0) {
          <span class="rh-fail">{{ compact(item.failingNow) }} {{ item.problem }}</span>
        } @else {
          <span class="rh-pass">Passing</span>
        }
      </button>
      @if (isOpen(item.id)) {
        <dl class="rh-ex">
          <dt>What it checks</dt>
          <dd>{{ item.whatItChecks }}</dd>
          <dt>What a failure means</dt>
          <dd>{{ item.whatFailureMeans }}</dd>
        </dl>
      }
    </li>
  }
</ul>
