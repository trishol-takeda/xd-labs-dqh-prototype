<dialog #dlg class="rh-dialog" aria-labelledby="rh-dlg-title" (close)="closed.emit()">
  <div class="rh-in">
    <h3 id="rh-dlg-title">{{ view().title }}</h3>
    @for (line of view().lines; track $index) {
      <p>{{ line }}</p>
    }
    <label for="rh-dlg-text">{{ view().label }}</label>
    <textarea
      #field
      id="rh-dlg-text"
      [value]="text()"
      [attr.aria-invalid]="missing() ? 'true' : null"
      (input)="text.set($any($event.target).value); missing.set(false)"
    ></textarea>
    @if (view().withReviewBy) {
      <label class="rh-field-gap" for="rh-dlg-review">Review by (required)</label>
      <input id="rh-dlg-review" type="date" [value]="reviewBy()" (input)="reviewBy.set($any($event.target).value)" />
    }
    <div class="rh-btns">
      <button type="button" class="rh-btn rh-ghost" (click)="cancel()">Cancel</button>
      <button type="button" class="rh-btn" (click)="confirm()">{{ view().confirmLabel }}</button>
    </div>
  </div>
</dialog>
