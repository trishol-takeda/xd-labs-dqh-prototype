<h2 class="rh-title">{{ title() }}</h2>
<p class="rh-sub">{{ subtitle() }}</p>
<input class="rh-filter" type="search" placeholder="Filter by product, table, site or field" aria-label="Filter" [value]="filter()" (input)="filter.set($any($event.target).value)" />

@if (groups().length === 0) {
  <app-state-panel kind="empty" [title]="filter() ? 'No matches' : 'Nothing waiting'" />
} @else {
  @for (group of groups(); track group.name) {
    <section class="rh-section">
      <h3>{{ group.name }} <span class="rh-n">{{ group.findings.length }}</span></h3>
      <div class="rh-rows">
        @for (f of group.findings; track f.id) {
          <app-finding-row [finding]="f" />
        }
      </div>
    </section>
  }
}
