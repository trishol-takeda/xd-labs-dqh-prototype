<app-modal title="Plan an action" confirmLabel="Add action" (confirmed)="save()" (closed)="closed.emit()">
  <div class="rh-levers" role="group" aria-label="Lever">
    @for (l of levers(); track l.key) {
      <button type="button" class="rh-lever" [attr.aria-pressed]="lever() === l.key" (click)="lever.set(l.key)">
        <b>{{ l.label }}</b><span>{{ l.meaning }}</span>
      </button>
    }
  </div>
  <label for="rh-act-owner">Owner</label>
  <input id="rh-act-owner" type="text" [value]="route().owner" readonly />
  <label for="rh-act-channel">Channel</label>
  <input id="rh-act-channel" type="text" [value]="route().channel" readonly />
  <label for="rh-act-ref">Reference</label>
  <input id="rh-act-ref" type="text" placeholder="CR / ticket / acceptance id" [value]="reference()" (input)="reference.set($any($event.target).value)" />
  <label for="rh-act-eff">Effective date</label>
  <input id="rh-act-eff" type="date" [value]="effective()" (input)="effective.set($any($event.target).value)" />
  <fieldset class="rh-opts rh-labelled">
    <legend>Covers</legend>
    @for (key of keys(); track key) {
      <label class="rh-opt">
        <input type="checkbox" [checked]="covers().includes(key)" (change)="toggle(key, $any($event.target).checked)" /> {{ finding().segments.labels[key] }}
      </label>
    }
  </fieldset>
  @if (lever() === 'stop_bleed') {
    <label for="rh-act-int">Interim control until live (optional)</label>
    <input id="rh-act-int" type="text" placeholder="e.g. manual check at record review" [value]="interim()" (input)="interim.set($any($event.target).value)" />
  }
  @if (lever() === 'accept') {
    <label for="rh-act-rev">Review by</label>
    <input id="rh-act-rev" type="date" [value]="reviewBy()" (input)="reviewBy.set($any($event.target).value)" />
    <p class="rh-gap">Approvers: {{ approvers() }}</p>
  }
</app-modal>
