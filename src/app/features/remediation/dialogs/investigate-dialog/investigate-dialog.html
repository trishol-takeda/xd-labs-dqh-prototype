<app-modal title="Record the root cause" confirmLabel="Save root cause" (confirmed)="save()" (closed)="closed.emit()">
  <p>What was actually found, not what the engine reported.</p>
  <fieldset class="rh-opts" [attr.aria-invalid]="causeMissing() ? 'true' : null">
    <legend class="sr-only">Root causes</legend>
    @for (r of rootCauses(); track r.key) {
      <label class="rh-opt">
        <input type="checkbox" [checked]="selected().includes(r.key)" (change)="toggle(r.key, $any($event.target).checked)" /> {{ r.label }}
      </label>
    }
  </fieldset>
  @if (causeMissing()) {
    <p class="rh-err" role="alert">Choose at least one root cause.</p>
  }
  <label for="rh-inv-note">Note (required)</label>
  <textarea id="rh-inv-note" [value]="note()" [attr.aria-invalid]="noteMissing() ? 'true' : null" (input)="note.set($any($event.target).value); noteMissing.set(false)"></textarea>
  <label class="rh-opt rh-plain">
    <input type="checkbox" [checked]="otherSites()" (change)="otherSites.set($any($event.target).checked)" /> Other sites checked
  </label>
</app-modal>
