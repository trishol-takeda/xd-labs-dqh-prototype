<app-modal title="Assess impact" confirmLabel="Save impact" (confirmed)="save()" (closed)="closed.emit()">
  <p>Could the parked records affect a GxP decision, traceability or a regulatory record?</p>
  <fieldset class="rh-opts">
    <legend class="sr-only">Impact</legend>
    @for (o of options; track o.key) {
      <label class="rh-opt">
        <input type="radio" name="rh-impact" [value]="o.key" [checked]="assessment() === o.key" (change)="assessment.set(o.key)" /> {{ o.label }}
      </label>
    }
  </fieldset>
  @if (needsDeviation()) {
    <p class="rh-gap">Raise a deviation and enter its reference.</p>
    <label for="rh-impact-dev">Deviation reference (required)</label>
    <input id="rh-impact-dev" type="text" placeholder="DEV-26-0000" [value]="deviation()" [attr.aria-invalid]="deviationMissing() ? 'true' : null" (input)="deviation.set($any($event.target).value); deviationMissing.set(false)" />
  }
  <label for="rh-impact-note">Note (required)</label>
  <textarea id="rh-impact-note" [value]="note()" [attr.aria-invalid]="noteMissing() ? 'true' : null" (input)="note.set($any($event.target).value); noteMissing.set(false)"></textarea>
</app-modal>
