<app-modal title="Set scope" confirmLabel="Save scope" (confirmed)="save()" (closed)="closed.emit()">
  <p>Choose what can be corrected. Parked records go to an impact assessment, then acceptance.</p>
  @if (finding().tier === 'critical') {
    <p>A Quality approver concurs with this scope.</p>
  }
  <fieldset class="rh-opts">
    <legend class="sr-only">Segments in scope</legend>
    @for (key of keys(); track key) {
      <label class="rh-opt">
        <input type="checkbox" [checked]="inScope().includes(key)" (change)="toggle(key, $any($event.target).checked)" />
        {{ finding().segments.labels[key] }} ({{ full(finding().segments[key]) }})
      </label>
    }
  </fieldset>
  <label for="rh-scope-why">Why (required)</label>
  <textarea #field id="rh-scope-why" [value]="reason()" [attr.aria-invalid]="missing() ? 'true' : null" (input)="reason.set($any($event.target).value); missing.set(false)"></textarea>
</app-modal>
