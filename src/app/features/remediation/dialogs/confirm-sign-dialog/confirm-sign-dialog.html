<app-modal title="Sign the confirmation" confirmLabel="Sign and confirm" (confirmed)="sign()" (closed)="closed.emit()">
  <p>GxP critical data: confirming the proposal is a recorded decision. Re-enter your password to sign. Meaning: <b>confirmed scope, root cause and plan</b>.</p>
  <label for="rh-confirm-pw">Password</label>
  <input id="rh-confirm-pw" type="password" autocomplete="current-password" [value]="password()" [attr.aria-invalid]="missing() ? 'true' : null" (input)="password.set($any($event.target).value); missing.set(false)" />
  <p class="rh-small">Manifestation: <b>[signer name]</b> · {{ who() }} · {{ stamp }}. The prototype shows the role; production shows the name.</p>
</app-modal>
